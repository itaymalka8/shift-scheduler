services:
  - type: web
    name: goalx-manager
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npx next start
    envVars:
      - key: NODE_ENV
        value: production
      # Points at an external Postgres database - a free Neon project
      # (https://neon.tech) works well. This service's own disk is NOT
      # persistent: SQLite on it was wiped on every redeploy (and possibly
      # on free-tier cold starts too), silently deleting every registered
      # account. Paste the connection string in the Render dashboard -
      # Environment tab for this service.
      #
      # Either Neon endpoint works. Writes are deliberately kept to short,
      # bulk transactions (see src/lib/leagues/seed.ts) precisely so the
      # pooled endpoint is safe: a long-running interactive transaction is
      # what a pooler terminates mid-flight, surfacing as Prisma P2028
      # "Transaction not found". If you ever add a genuinely long
      # transaction, use the direct (non "-pooler") host for it.
      - key: DATABASE_URL
        sync: false
      # A fixed secret you set once in the Render dashboard - Environment tab,
      # not a Blueprint-generated value. Every signed-in session's JWT is
      # signed with this; if it ever changed, every existing session would
      # stop validating at once, indistinguishable from a mass logout.
      # Generate one with: openssl rand -base64 32
      #
      # Changing this line from `generateValue: true` does NOT reset or
      # rotate whatever value Render already generated for this service -
      # that value stays exactly as it is; this only stops the Blueprint
      # from ever being able to touch it going forward.
      - key: NEXTAUTH_SECRET
        sync: false
      # Must exactly match this service's real production URL (protocol,
      # host, no trailing slash) - e.g. https://goalx-manager.onrender.com,
      # or your custom domain if one is configured instead.
      - key: NEXTAUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_SECRET
        sync: false

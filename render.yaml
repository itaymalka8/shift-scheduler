services:
  - type: web
    name: goalx-manager
    env: node
    plan: free
    buildCommand: npm install --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npx next start
    envVars:
      - key: NODE_ENV
        value: production
      # Points at an external Postgres database - a free Neon project
      # (https://neon.tech) works well. This service's own disk is NOT
      # persistent: SQLite on it was wiped on every redeploy (and possibly
      # on free-tier cold starts too), silently deleting every registered
      # account. Paste the connection string in the Render dashboard -
      # Environment tab for this service.
      #
      # Either Neon endpoint works. Writes are deliberately kept to short,
      # bulk transactions (see src/lib/leagues/seed.ts) precisely so the
      # pooled endpoint is safe: a long-running interactive transaction is
      # what a pooler terminates mid-flight, surfacing as Prisma P2028
      # "Transaction not found". If you ever add a genuinely long
      # transaction, use the direct (non "-pooler") host for it.
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_CLIENT_SECRET
        sync: false

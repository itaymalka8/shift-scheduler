name: Production Operations

# Manual-only, on purpose - this workflow never runs on push/PR/schedule.
# Every invocation is a deliberate choice of exactly one command from the
# dropdown below, triggered either from the GitHub Actions UI or via the
# API (workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      command:
        description: "Production operation to run"
        required: true
        type: choice
        options:
          - prod:preflight
          - prod:season-status
          - prod:scheduled-check
          - prod:post-deploy-check
          - prod:render:status
          - prod:backup:list
          - prod:backup:prune
          - prod:eras:classify
          - prod:eras:verify
          - prod:verify:player-stats
          - prod:champions:verify
          - prod:routes:check
          - prod:retention:verify
          - prod:players:distribution
          - prod:render:autodeploy:off
          - prod:backup:create
          - prod:backup:prune:execute
          - prod:deploy:safe
      branch_ids:
        description: "prod:backup:prune only - explicit comma-separated Neon branch ids to prune. Leave empty for an inventory + recommendation. There is no wildcard."
        required: false
        type: string

# Secrets come ONLY from this repository's GitHub Secrets
# (Settings > Secrets and variables > Actions): RENDER_API_KEY,
# NEON_API_KEY, PRODUCTION_DATABASE_URL. They are never read from the
# Claude Cloud environment, never committed, and never echoed - each job
# below passes them straight from `secrets.*` into the process env of the
# one script that needs them, and every scripts/production/*.ts script
# already prints only host/database name or presence booleans, never a
# credential value (see src/lib/production/env-guard.ts and report.ts).

jobs:
  # ---------------------------------------------------------------------
  # Every read-only production command. The four commands that mutate
  # Production - prod:deploy:safe, prod:render:autodeploy:off,
  # prod:backup:create and prod:backup:prune:execute - are deliberately
  # excluded here; each gets its own job below, because
  # PRODUCTION_WRITE_CONFIRM must never be in scope for a read-only run.
  # prod:backup:prune (no :execute) IS read-only and belongs here: without
  # the confirmation in scope it cannot delete even if asked to.
  # ---------------------------------------------------------------------
  read-only:
    if: >-
      github.event.inputs.command != 'prod:deploy:safe' &&
      github.event.inputs.command != 'prod:render:autodeploy:off' &&
      github.event.inputs.command != 'prod:backup:create' &&
      github.event.inputs.command != 'prod:backup:prune:execute'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Belt-and-suspenders on top of GitHub's automatic secret masking
      # (which already masks the exact value of any `secrets.*` reference
      # used in this job): PRODUCTION_DATABASE_URL is a connection string
      # with a password embedded inside it, and GitHub's masking only
      # matches the *whole* secret value verbatim - a log line that only
      # contains the password substring (e.g. from a raw driver error)
      # would not be caught by that alone. This step registers the
      # password portion as an additional mask, so it's covered here too.
      - name: Register additional secret masks
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          PASSWORD=$(node -e "try{const u=new URL(process.env.PRODUCTION_DATABASE_URL||''); if(u.password) console.log(u.password)}catch(e){}")
          if [ -n "$PASSWORD" ]; then echo "::add-mask::$PASSWORD"; fi

      - name: Run production command
        env:
          COMMAND: ${{ github.event.inputs.command }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          # Read by prod:backup:prune only. This job never sets
          # PRODUCTION_WRITE_CONFIRM, so a prune reaching it is a DRY RUN by
          # construction - even PRUNE_EXECUTE could not make it delete.
          PRUNE_BRANCH_IDS: ${{ github.event.inputs.branch_ids }}
        run: npm run "$COMMAND"

  # ---------------------------------------------------------------------
  # prod:render:autodeploy:off only. Mutates Render service CONFIGURATION
  # (the Auto Deploy flag) and nothing else - no deploy, no database, no
  # suspend/resume. It needs PRODUCTION_WRITE_CONFIRM, so like the deploy
  # job it lives on its own and NEON_API_KEY / PRODUCTION_DATABASE_URL are
  # not passed to it at all: this command has no business touching either.
  # ---------------------------------------------------------------------
  autodeploy-off:
    if: github.event.inputs.command == 'prod:render:autodeploy:off'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run prod:render:autodeploy:off
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          PRODUCTION_WRITE_CONFIRM: I_UNDERSTAND_THIS_CHANGES_PRODUCTION
        run: npm run prod:render:autodeploy:off

  # ---------------------------------------------------------------------
  # prod:backup:create only. MUTATES the Neon account (provisions a new
  # backup branch). No Render key, no database URL - creating a branch has
  # no business with either.
  # ---------------------------------------------------------------------
  backup-create:
    if: github.event.inputs.command == 'prod:backup:create'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Run prod:backup:create
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PRODUCTION_WRITE_CONFIRM: I_UNDERSTAND_THIS_CHANGES_PRODUCTION
        run: npm run prod:backup:create

  # ---------------------------------------------------------------------
  # prod:backup:prune:execute only. DESTRUCTIVE: permanently deletes Neon
  # backup branches, which Neon cannot undo and this project keeps no copy
  # of. It runs ONLY with an explicit branch_ids allowlist - the step below
  # refuses before npm is invoked when that input is empty, and the script
  # itself refuses a wildcard anyway.
  #
  # Run prod:backup:prune (the read-only job) FIRST and read its plan. The
  # ids you paste here should be the ones that dry run printed.
  # ---------------------------------------------------------------------
  backup-prune-execute:
    if: github.event.inputs.command == 'prod:backup:prune:execute'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Refuse an empty allowlist
        env:
          BRANCH_IDS: ${{ github.event.inputs.branch_ids }}
        run: |
          if [ -z "$BRANCH_IDS" ]; then
            echo "REFUSED: prod:backup:prune:execute requires an explicit branch_ids allowlist."
            echo "Run prod:backup:prune first to get the plan, then paste those ids in."
            exit 1
          fi
          echo "Allowlist: $BRANCH_IDS"

      - name: Run prod:backup:prune:execute
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PRUNE_BRANCH_IDS: ${{ github.event.inputs.branch_ids }}
          PRODUCTION_WRITE_CONFIRM: I_UNDERSTAND_THIS_CHANGES_PRODUCTION
        run: npm run prod:backup:prune:execute

  # ---------------------------------------------------------------------
  # prod:deploy:safe only. PRODUCTION_WRITE_CONFIRM is set ONLY in this
  # job's env - no other job in this workflow ever sees it, so no other
  # command here can accidentally satisfy a write guard.
  # ---------------------------------------------------------------------
  safe-deploy:
    if: github.event.inputs.command == 'prod:deploy:safe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Register additional secret masks
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          PASSWORD=$(node -e "try{const u=new URL(process.env.PRODUCTION_DATABASE_URL||''); if(u.password) console.log(u.password)}catch(e){}")
          if [ -n "$PASSWORD" ]; then echo "::add-mask::$PASSWORD"; fi

      - name: Run prod:deploy:safe
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PRODUCTION_WRITE_CONFIRM: I_UNDERSTAND_THIS_CHANGES_PRODUCTION
        run: npm run prod:deploy:safe
